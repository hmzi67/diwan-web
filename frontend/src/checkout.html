<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout — Diwan POS</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0A0F0D">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&amp;display=swap">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/theme.js"></script>
  <link rel="icon" type="image/png" href="/assets/logo.png">
  <link rel="apple-touch-icon" href="/assets/logo.png">
</head>
<body>
  <a class="absolute -left-[9999px] z-[100] rounded-sm bg-accent px-[1.1rem] py-[.7rem] text-accent-ink focus:left-[clamp(1.25rem,4vw,2rem)] focus:top-3" href="#main">Skip to content</a>

    <header class="group/nav sticky top-0 z-50 px-[clamp(.75rem,3vw,1.5rem)] pt-3" id="nav">
      <div
        class="relative mx-auto flex w-full max-w-[1180px] items-center gap-3 rounded-full border border-line/70 bg-canvas/70 py-2 pr-2 pl-5 shadow-[inset_0_1px_0_rgb(255_255_255/.04)] backdrop-blur-xl backdrop-saturate-150 transition-[background-color,border-color,box-shadow] duration-300 ease-diwan group-data-[stuck=true]/nav:border-line-hi group-data-[stuck=true]/nav:bg-surface/80 group-data-[stuck=true]/nav:shadow-[0_18px_40px_-24px_rgb(0_0_0/.8),inset_0_1px_0_rgb(255_255_255/.05)] max-[480px]:pl-4"
      >
        <div class="flex flex-1">
          <a class="brand inline-flex items-center gap-[.55rem] text-[1.15rem] font-bold tracking-[-.02em]" href="/">
            <img class="brand__mark" src="/assets/logo-56.png" alt="" width="28" height="28" />
            Diwan
          </a>
        </div>

        <nav
          class="flex items-center gap-0.5 transition-[opacity,translate] duration-200 ease-diwan max-[960px]:absolute max-[960px]:inset-x-0 max-[960px]:top-[calc(100%+.6rem)] max-[960px]:flex-col max-[960px]:items-stretch max-[960px]:gap-1 max-[960px]:rounded-3xl max-[960px]:border max-[960px]:border-line max-[960px]:bg-surface max-[960px]:p-2 max-[960px]:shadow-[0_30px_60px_-24px_rgb(0_0_0/.85)] max-[960px]:backdrop-blur-xl max-[960px]:starting:-translate-y-2 max-[960px]:starting:opacity-0"
          id="nav-links"
          aria-label="Primary"
        >
          <a class="rounded-full px-3.5 py-2 text-[.9rem] text-muted whitespace-nowrap transition-colors duration-200 ease-diwan hover:bg-surface-hi hover:text-ink aria-[current=page]:bg-surface-hi aria-[current=page]:text-ink max-[960px]:rounded-2xl max-[960px]:px-4 max-[960px]:py-3 max-[960px]:text-base" href="/features.html">Features</a>
          <a class="rounded-full px-3.5 py-2 text-[.9rem] text-muted whitespace-nowrap transition-colors duration-200 ease-diwan hover:bg-surface-hi hover:text-ink aria-[current=page]:bg-surface-hi aria-[current=page]:text-ink max-[960px]:rounded-2xl max-[960px]:px-4 max-[960px]:py-3 max-[960px]:text-base" href="/products.html">Products</a>
          <a class="rounded-full px-3.5 py-2 text-[.9rem] text-muted whitespace-nowrap transition-colors duration-200 ease-diwan hover:bg-surface-hi hover:text-ink aria-[current=page]:bg-surface-hi aria-[current=page]:text-ink max-[960px]:rounded-2xl max-[960px]:px-4 max-[960px]:py-3 max-[960px]:text-base" href="/pricing.html">Pricing</a>
          <a class="rounded-full px-3.5 py-2 text-[.9rem] text-muted whitespace-nowrap transition-colors duration-200 ease-diwan hover:bg-surface-hi hover:text-ink aria-[current=page]:bg-surface-hi aria-[current=page]:text-ink max-[960px]:rounded-2xl max-[960px]:px-4 max-[960px]:py-3 max-[960px]:text-base" href="/support.html">Docs &amp; Support</a>
          <a class="rounded-full px-3.5 py-2 text-[.9rem] text-muted whitespace-nowrap transition-colors duration-200 ease-diwan hover:bg-surface-hi hover:text-ink aria-[current=page]:bg-surface-hi aria-[current=page]:text-ink max-[960px]:rounded-2xl max-[960px]:px-4 max-[960px]:py-3 max-[960px]:text-base" href="/contact.html">Contact</a>
          <a class="rounded-full px-3.5 py-2 text-[.9rem] text-muted whitespace-nowrap transition-colors duration-200 ease-diwan hover:bg-surface-hi hover:text-ink aria-[current=page]:bg-surface-hi aria-[current=page]:text-ink max-[960px]:rounded-2xl max-[960px]:px-4 max-[960px]:py-3 max-[960px]:text-base min-[961px]:hidden" href="/auth/login.html">Log in</a>
          <a class="mt-1 rounded-2xl bg-accent px-4 py-3 text-center text-base font-semibold text-accent-ink transition-colors hover:bg-accent-hi sm:hidden" href="/pricing.html">Get Started</a>
        </nav>

        <div class="flex items-center justify-end gap-1.5 min-[961px]:flex-1">
          <a class="rounded-full px-3.5 py-2 text-[.9rem] text-muted whitespace-nowrap transition-colors duration-200 ease-diwan hover:text-ink max-[960px]:hidden" href="/auth/login.html">Log in</a>
          <a
            class="group/cta inline-flex items-center gap-1.5 whitespace-nowrap rounded-full bg-accent px-5 py-2.5 text-[.9rem] font-semibold text-accent-ink shadow-[inset_0_1px_0_rgb(255_255_255/.25),0_8px_24px_-12px_var(--color-accent)] transition duration-200 ease-diwan hover:-translate-y-px hover:bg-accent-hi hover:shadow-[inset_0_1px_0_rgb(255_255_255/.25),0_12px_30px_-10px_var(--color-accent)] max-sm:hidden"
            href="/pricing.html"
          >
            Get Started
            <svg class="transition-transform duration-200 ease-diwan group-hover/cta:translate-x-0.5" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </a>
          <button
            class="group/menu hidden size-10 cursor-pointer place-items-center rounded-full border border-line bg-surface p-0 text-ink transition-colors duration-200 ease-diwan hover:border-line-hi max-[960px]:inline-grid"
            id="nav-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="nav-links"
            aria-label="Menu"
          >
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
              <path class="origin-center transition duration-300 ease-diwan [transform-box:fill-box] group-aria-expanded/menu:translate-y-1 group-aria-expanded/menu:rotate-45" d="M3 5h12" />
              <path class="transition-opacity duration-200 group-aria-expanded/menu:opacity-0" d="M3 9h12" />
              <path class="origin-center transition duration-300 ease-diwan [transform-box:fill-box] group-aria-expanded/menu:-translate-y-1 group-aria-expanded/menu:-rotate-45" d="M3 13h12" />
            </svg>
          </button>
        </div>
      </div>
    </header>

  <main id="main">
    <section class="flex min-h-[calc(100vh-78px)] items-center justify-center px-[clamp(1.25rem,4vw,2rem)] py-[clamp(4.5rem,9vw,8rem)]">
      <div class="w-full max-w-[420px] rounded-lg border border-line bg-surface px-8 py-9 text-center">
        <div class="mx-auto mb-5 grid size-12 place-items-center rounded-[14px] bg-[linear-gradient(145deg,var(--color-accent),var(--color-accent-dim))] text-[1.3rem] font-extrabold text-accent-ink shadow-[0_0_24px_-6px_var(--color-accent)]" aria-hidden="true">D</div>
        <h1 class="mb-2 text-[1.5rem] tracking-[-.02em]" id="checkout-title">Checkout</h1>
        <p class="mb-7 text-[.92rem] text-muted" id="checkout-summary">Loading your plan…</p>

        <form class="flex flex-col gap-[.9rem] text-left" id="checkout-form" hidden>
          <label class="flex flex-col gap-[.35rem] text-[.85rem] text-muted">
            Email
            <span class="w-full rounded-sm border border-line bg-elevated px-4 py-[.8rem] text-[.95rem] text-muted focus:border-accent-dim focus:outline-none"" id="checkout-email"></span>
          </label>
          <label class="flex flex-col gap-[.35rem] text-[.85rem] text-muted">
            Phone
            <input class="w-full rounded-sm border border-line bg-elevated px-4 py-[.8rem] text-[.95rem] text-ink focus:border-accent-dim focus:outline-none" type="tel" name="phone" required
                   placeholder="03001234567" autocomplete="tel">
          </label>
          <button class="inline-flex items-center justify-center gap-[.55rem] whitespace-nowrap rounded-full border border-transparent bg-accent px-6 py-[.8rem] text-[.95rem] font-semibold text-accent-ink shadow-[0_0_0_0_var(--color-glow)] transition duration-200 ease-diwan hover:-translate-y-px hover:bg-accent-hi hover:shadow-[0_8px_30px_-8px_var(--color-accent)]" type="submit">Pay with JazzCash</button>
        </form>
        <p id="checkout-status" class="min-h-6 text-[.9rem] text-muted" role="status"></p>

        <a class="mt-6 inline-block text-[.85rem] text-muted hover:text-ink" href="pricing.html">← Choose a different plan</a>
      </div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/checkout.js"></script>
</body>
</html>
