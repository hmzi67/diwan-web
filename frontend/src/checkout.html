<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout — Diwan POS</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0A0F0D">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

    <header class="nav" id="nav">
    <div class="wrap nav__inner">
      <a class="brand" href="/">
        <span class="brand__mark" aria-hidden="true">D</span>
        Diwan
      </a>

      <nav class="nav__links" id="nav-links" aria-label="Primary">
        <a href="features.html">Features</a>
        <a href="products.html">Products</a>
        <a href="pricing.html">Pricing</a>
        <a href="support.html">Docs &amp; Support</a>
        <a href="contact.html">Contact</a>
      </nav>

      <div class="nav__actions">
        <a class="nav__login" href="/auth/sign-in.html">Log in</a>
        <a class="btn btn--primary" href="pricing.html">Get Started</a>
        <button class="nav__toggle" id="nav-toggle" type="button"
                aria-expanded="false" aria-controls="nav-links" aria-label="Menu">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path d="M2 5h14M2 9h14M2 13h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="auth">
      <div class="auth__card">
        <div class="auth__mark" aria-hidden="true">D</div>
        <h1 id="checkout-title">Checkout</h1>
        <p class="sub" id="checkout-summary">Loading your plan…</p>

        <form class="auth__form" id="checkout-form" hidden>
          <label class="field">
            Email
            <span class="input" id="checkout-email" style="color:var(--text-muted)"></span>
          </label>
          <label class="field">
            Phone
            <input class="input" type="tel" name="phone" required
                   placeholder="03001234567" autocomplete="tel">
          </label>
          <button class="btn btn--primary" type="submit">Pay with JazzCash</button>
        </form>
        <p id="checkout-status" role="status"></p>

        <a class="auth__back" href="pricing.html">← Choose a different plan</a>
      </div>
    </section>
  </main>

  <script src="/js/main.js"></script>
  <script src="/js/checkout.js"></script>
</body>
</html>
