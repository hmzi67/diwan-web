<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Diwan POS</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0A0F0D">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<!--
  Wired to POST /api/sign-in.php. Sets the same signed session cookie every
  other authenticated endpoint already reads (Diwan\Auth\Session), so
  checkout.php and dashboard-data.php needed no changes.
-->
<body>
  <a class="absolute -left-[9999px] z-[100] rounded-sm bg-accent px-[1.1rem] py-[.7rem] text-accent-ink focus:left-[clamp(1.25rem,4vw,2rem)] focus:top-3" href="#main">Skip to content</a>

  <main id="main" class="grid min-h-screen grid-cols-[45fr_55fr] max-lg:grid-cols-1">
    <div class="glow-auth relative isolate flex flex-col justify-center gap-9 overflow-hidden border-r border-line bg-elevated p-10 max-lg:min-h-[140px] max-lg:flex-row max-lg:items-center max-lg:justify-between max-lg:gap-6 max-lg:border-r-0 max-lg:border-b max-lg:px-[clamp(1.25rem,4vw,2rem)] max-lg:py-6 max-md:min-h-0 max-md:py-4">
      <div class="rays-auth" aria-hidden="true"></div>

      <a class="mr-auto inline-flex items-center gap-[.55rem] text-[1.15rem] font-bold tracking-[-.02em] absolute left-10 top-10 z-[1] max-lg:static" href="/">
        <span class="grid size-7 place-items-center rounded-[8px] bg-[linear-gradient(145deg,var(--color-accent),var(--color-accent-dim))] text-[.85rem] font-extrabold text-accent-ink shadow-[0_0_18px_-4px_var(--color-accent)]" aria-hidden="true">D</span>
        Diwan
      </a>

      <div class="max-w-[34ch] max-lg:max-w-[42ch] max-lg:text-right max-md:hidden">
        <h2 class="mb-[.6rem] text-[1.35rem] leading-[1.3] tracking-[-.02em] max-lg:mb-0 max-lg:text-[1rem]">Welcome back.</h2>
        <p>Your licences, downloads and activation status — all in one place.</p>
      </div>
    </div>

    <div class="flex items-center justify-center px-[clamp(1.25rem,4vw,2rem)] py-[clamp(4.5rem,9vw,8rem)] max-lg:py-[clamp(2.5rem,8vw,4rem)]">
      <div class="w-full max-w-[400px]">

        <div id="step-form">
          <h1 class="mb-2 text-[1.75rem] tracking-[-.025em]">Sign in</h1>
          <p class="mb-7 text-[.92rem] text-muted">Manage your licences, downloads and receipts.</p>

          <form class="flex flex-col gap-[.9rem] text-left" id="signin-form" novalidate>
            <label class="flex flex-col gap-[.35rem] text-[.85rem] text-muted" for="si-email">
              Email address
              <input class="w-full rounded-sm border border-line bg-elevated px-4 py-[.8rem] text-[.95rem] text-ink focus:border-accent-dim focus:outline-none" id="si-email" name="email" type="email" required
                     placeholder="you@example.com" autocomplete="email">
            </label>

            <div class="flex flex-col gap-[.35rem] text-[.85rem] text-muted">
              <div class="flex items-baseline justify-between gap-4">
                <label for="si-password">Password</label>
                <a class="text-[.82rem] text-accent hover:text-accent-hi" href="forgot-password.html" id="forgot-link" data-carry-plan>Forgot password?</a>
              </div>
              <div class="relative flex">
                <input class="w-full rounded-sm border border-line bg-elevated px-4 py-[.8rem] text-[.95rem] text-ink focus:border-accent-dim focus:outline-none" id="si-password" name="password" type="password" required
                       placeholder="Your password" autocomplete="current-password" data-pw>
                <button class="absolute right-1 top-1/2 -translate-y-1/2 cursor-pointer rounded-sm border-0 bg-transparent px-[.6rem] py-[.35rem] text-[.78rem] font-semibold text-muted hover:text-accent" type="button" data-pw-toggle aria-label="Show password">Show</button>
              </div>
            </div>

            <button class="inline-flex items-center justify-center gap-[.55rem] whitespace-nowrap rounded-full border border-transparent bg-accent px-6 py-[.8rem] text-[.95rem] font-semibold text-accent-ink shadow-[0_0_0_0_var(--color-glow)] transition duration-200 ease-diwan hover:-translate-y-px hover:bg-accent-hi hover:shadow-[0_8px_30px_-8px_var(--color-accent)]" type="submit">Sign in</button>
          </form>
          <p id="signin-status" class="min-h-6 text-[.9rem] text-muted" role="status"></p>

          <p class="mt-6 text-[.9rem] text-muted [&_a]:text-accent">New to Diwan? <a href="sign-up.html" data-carry-plan>Create an account</a></p>
        </div>


      </div>
    </div>
  </main>

  <script src="/js/auth-ui.js"></script>
</body>
</html>
