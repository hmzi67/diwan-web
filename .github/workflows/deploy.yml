name: Deploy

# ---------------------------------------------------------------------------
# push to `staging` -> staging site (automatic)
# push to `main`    -> production   (requires manual approval, see README)
# push tag `v1.2.3`        -> production (same dry run + approval; the tagged
#                             commit must already be on `main`)
# push tag `v1.2.3-rc.1`   -> staging    (any tag with a `-` suffix)
# workflow_dispatch -> either, with an optional dry run
# ---------------------------------------------------------------------------
on:
  push:
    branches: [main, staging]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to deploy'
        required: true
        default: staging
        type: choice
        options: [staging, production]
      dry_run:
        description: 'Dry run only — list changes, upload nothing'
        required: false
        default: false
        type: boolean

# Never let two deploys race to the same FTP account.
# One FTP account serves staging AND production, and shared hosts cap concurrent
# logins. A ref-keyed group would let a staging push and a main push connect at
# the same moment; a constant group makes every deploy queue instead.
concurrency:
  group: ftp-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The action defaults to 30000ms. Shared hosts under load routinely take
  # longer than that to answer a control-socket command, which surfaces as
  # "Error: Timeout (control socket)".
  FTP_TIMEOUT_MS: '60000'

jobs:
  # ==========================================================================
  # 0. TESTS — the full CI suite (lint, migrations, unit and HTTP tests) gates
  #    every deploy, so nothing reaches FTP that has not passed it.
  # ==========================================================================
  verify:
    name: Tests
    uses: ./.github/workflows/ci.yml

  # ==========================================================================
  # 1. BUILD — everything that can fail, fails here, before any FTP connection
  # ==========================================================================
  build:
    name: Build & verify
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }   # the tag guard below walks main's history

      # A stable tag deploys to production, so it must not be able to ship a
      # commit that never went through `main`. Pre-release tags go to staging
      # and may point anywhere.
      - name: Guard — stable release tags must be on main
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main. Merge to main first, then tag."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} is on main."

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'   # match the server; see docs/SERVER-CHECKLIST.md
          tools: none

      - name: Lint every PHP file
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null || { echo "::error file=$file::PHP syntax error"; fail=1; }
          done < <(find backend -name '*.php' -print0)
          [ "$fail" -eq 0 ] || exit 1
          echo "PHP lint passed."

      - name: Build frontend
        run: bash frontend/build.sh   # `set -e` inside; a failure stops the job

      - name: Assemble deployment bundle
        run: |
          set -euo pipefail
          # bundle/web -> public_html      (static site + api/)
          # bundle/app -> ~/app            (PHP classes, NOT web accessible)
          mkdir -p bundle/web/api bundle/app/src bundle/app/config

          cp -R frontend/dist/.        bundle/web/
          cp -R backend/public/.       bundle/web/api/
          cp -R backend/src/.          bundle/app/src/

          # Things that must never reach the server. router.php is the local
          # `php -S` router only; on Apache it would just be a stray entrypoint.
          rm -f  bundle/web/api/_app_root.php.example bundle/web/api/router.php
          rm -rf bundle/web/node_modules bundle/app/node_modules
          find bundle -name '.DS_Store' -delete
          find bundle -name '*.md'      -delete
          find bundle -name '.env*'     -delete

          echo "--- bundle contents ---"
          find bundle -type f | sort

      # Hard stop: a binary or a secret in the bundle is a release-blocking bug.
      - name: Guard — no installers or secrets in the bundle
        run: |
          set -euo pipefail
          if find bundle -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.apk' \
               -o -name '*.msi' -o -name '*.pkg' \) | grep -q .; then
            echo "::error::Installer binaries found in the deploy bundle. They belong in private-storage, uploaded manually."
            exit 1
          fi
          if find bundle -name '.env' -o -name '.env.*' | grep -q .; then
            echo "::error::An .env file is in the deploy bundle."
            exit 1
          fi
          if grep -rIl --exclude-dir=.git -E 'JAZZCASH_INTEGRITY_SALT=[^[:space:]]|DB_PASS=[^[:space:]]' bundle 2>/dev/null | grep -q .; then
            echo "::error::Hardcoded credentials detected in the deploy bundle."
            exit 1
          fi
          echo "Bundle guard passed."

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-bundle
          path: bundle/
          retention-days: 7
          include-hidden-files: true   # .htaccess files are the whole point

  # ==========================================================================
  # 2. STAGING — automatic on push to `staging`
  # ==========================================================================
  deploy-staging:
    name: Deploy to staging
    needs: build
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/staging') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')) ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { sparse-checkout: scripts }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: deploy-bundle, path: bundle }

      - name: Preflight — verify server paths before connecting
        # Values come in via `env:` rather than being interpolated straight into
        # the shell: it keeps a variable containing quotes or $() from being
        # executed, and it lets the step report what actually resolved.
        env:
          JOB_ENVIRONMENT: 'staging'
          SITE_URL: ${{ vars.SITE_URL }}
          APP_ROOT: ${{ vars.APP_ROOT }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || secrets.FTP_SERVER_DIR }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ vars.FTP_PORT || 21 }}
        run: |
          echo "Variable resolution for this job"
          echo "  job environment : ${JOB_ENVIRONMENT}"
          echo "  repository      : ${GITHUB_REPOSITORY}"
          for v in SITE_URL APP_ROOT FTP_SERVER_DIR; do
            val="${!v}"
            if [ -n "$val" ]; then
              printf '  %-18s set (%s chars)\n' "vars.$v" "${#val}"
            else
              printf '  %-18s EMPTY — not visible to this job\n' "vars.$v"
            fi
          done
          echo
          bash scripts/preflight-paths.sh "$FTP_SERVER_DIR" "${APP_ROOT}/" "$SITE_URL"
          echo
          bash scripts/check-ftp-host.sh "$FTP_HOST" "${FTP_PORT:-21}"

      - name: Generate server config from secrets
        # Every value arrives through env: and is written with printf, never
        # interpolated into the script: a secret containing $, a backtick or
        # $( would otherwise be expanded or executed by the shell.
        env:
          CFG_APP_ENV: staging
          CFG_APP_DEBUG: false
          CFG_APP_URL: ${{ vars.SITE_URL }}
          CFG_APP_KEY: ${{ secrets.APP_KEY }}
          CFG_APP_COMMIT: ${{ github.sha }}
          CFG_DB_HOST: ${{ secrets.DB_HOST }}
          CFG_DB_PORT: ${{ vars.DB_PORT || '3306' }}
          CFG_DB_NAME: ${{ secrets.DB_NAME }}
          CFG_DB_USER: ${{ secrets.DB_USER }}
          CFG_DB_PASS: ${{ secrets.DB_PASS }}
          CFG_LICENSE_VALIDITY_DAYS: ${{ vars.LICENSE_VALIDITY_DAYS || 0 }}
          CFG_TRIAL_SIGNUP_ENABLED: ${{ vars.TRIAL_SIGNUP_ENABLED || 'true' }}
          CFG_LICENSE_SIGNING_KEY_ID: ${{ vars.LICENSE_SIGNING_KEY_ID || 'default' }}
          CFG_LICENSE_SIGNING_PRIVATE_KEY: ${{ secrets.LICENSE_SIGNING_PRIVATE_KEY }}
          CFG_LICENSE_MAX_OFFLINE_DAYS: ${{ vars.LICENSE_MAX_OFFLINE_DAYS || 30 }}
          CFG_DOWNLOAD_LINK_TTL_MINUTES: ${{ vars.DOWNLOAD_LINK_TTL_MINUTES || 15 }}
          CFG_DOWNLOAD_MAX_ATTEMPTS: ${{ vars.DOWNLOAD_MAX_ATTEMPTS || 20 }}
          CFG_PAYMENT_GATEWAY: ${{ vars.PAYMENT_GATEWAY }}
          CFG_JAZZCASH_MERCHANT_ID: ${{ secrets.JAZZCASH_MERCHANT_ID }}
          CFG_JAZZCASH_PASSWORD: ${{ secrets.JAZZCASH_PASSWORD }}
          CFG_JAZZCASH_INTEGRITY_SALT: ${{ secrets.JAZZCASH_INTEGRITY_SALT }}
          CFG_JAZZCASH_ENDPOINT: ${{ vars.JAZZCASH_ENDPOINT }}
          CFG_EASYPAISA_STORE_ID: ${{ secrets.EASYPAISA_STORE_ID }}
          CFG_EASYPAISA_HASH_KEY: ${{ secrets.EASYPAISA_HASH_KEY }}
          CFG_SAFEPAY_API_KEY: ${{ secrets.SAFEPAY_API_KEY }}
          CFG_SAFEPAY_WEBHOOK_SECRET: ${{ secrets.SAFEPAY_WEBHOOK_SECRET }}
          CFG_MAIL_DRIVER: ${{ vars.MAIL_DRIVER || 'sendmail' }}
          CFG_MAIL_HOST: ${{ vars.MAIL_HOST || 'smtp.hostinger.com' }}
          CFG_MAIL_PORT: ${{ vars.MAIL_PORT || '587' }}
          CFG_MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          CFG_MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          CFG_APPLE_BUNDLE_ID: ${{ vars.APPLE_BUNDLE_ID || 'com.diwan.pos' }}
          CFG_APPLE_APP_ID: ${{ vars.APPLE_APP_ID }}
          CFG_APPLE_IAP_ALLOW_SANDBOX: ${{ vars.APPLE_IAP_ALLOW_SANDBOX || 'true' }}
          CFG_APPLE_SIGN_IN_SERVICES_ID: ${{ vars.APPLE_SIGN_IN_SERVICES_ID }}
          CFG_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          CFG_APPLE_SIGN_IN_KEY_ID: ${{ vars.APPLE_SIGN_IN_KEY_ID }}
          CFG_APPLE_SIGN_IN_PRIVATE_KEY: ${{ secrets.APPLE_SIGN_IN_PRIVATE_KEY }}
          CFG_MAIL_FROM: ${{ vars.MAIL_FROM }}
          CFG_MAIL_FROM_NAME: Diwan POS
          CFG_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          CFG_GITHUB_RELEASES_REPO: ${{ vars.POS_RELEASES_REPO || 'hmzi67/point-of-sale' }}
          CFG_GITHUB_RELEASES_TOKEN: ${{ secrets.POS_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          # upload-artifact drops empty directories, so bundle/app/config/ does
          # not survive the round-trip from the build job. Recreate it here.
          mkdir -p bundle/app/config
          keys=(
            APP_ENV
            APP_DEBUG
            APP_URL
            APP_KEY
            APP_COMMIT
            DB_HOST
            DB_PORT
            DB_NAME
            DB_USER
            DB_PASS
            LICENSE_VALIDITY_DAYS
            TRIAL_SIGNUP_ENABLED
            LICENSE_SIGNING_KEY_ID
            LICENSE_SIGNING_PRIVATE_KEY
            LICENSE_MAX_OFFLINE_DAYS
            DOWNLOAD_LINK_TTL_MINUTES
            DOWNLOAD_MAX_ATTEMPTS
            PAYMENT_GATEWAY
            JAZZCASH_MERCHANT_ID
            JAZZCASH_PASSWORD
            JAZZCASH_INTEGRITY_SALT
            JAZZCASH_ENDPOINT
            EASYPAISA_STORE_ID
            EASYPAISA_HASH_KEY
            SAFEPAY_API_KEY
            SAFEPAY_WEBHOOK_SECRET
            MAIL_DRIVER
            MAIL_HOST
            MAIL_PORT
            MAIL_USERNAME
            MAIL_PASSWORD
            APPLE_BUNDLE_ID
            APPLE_APP_ID
            APPLE_IAP_ALLOW_SANDBOX
            APPLE_SIGN_IN_SERVICES_ID
            APPLE_TEAM_ID
            APPLE_SIGN_IN_KEY_ID
            APPLE_SIGN_IN_PRIVATE_KEY
            MAIL_FROM
            MAIL_FROM_NAME
            CONTACT_EMAIL
            GITHUB_RELEASES_REPO
            GITHUB_RELEASES_TOKEN
          )
          for key in "${keys[@]}"; do
            value_var="CFG_${key}"
            printf '%s=%s\n' "$key" "${!value_var-}"
          done > bundle/app/config/.env
          # Prove the file exists and is populated, without printing any value.
          # Keys only: a missing secret shows up as a key with an empty value.
          echo "--- generated .env ---"
          test -s bundle/app/config/.env || { echo "::error::.env is missing or empty"; exit 1; }
          awk -F= '/^[A-Z]/ { printf "  %-26s %s\n", $1, ($2 == "" ? "(EMPTY!)" : "set") }' \
            bundle/app/config/.env
          empty=$(awk -F= '/^[A-Z]/ && $2 == "" { c++ } END { print c+0 }' bundle/app/config/.env)
          echo "  -> $(grep -c '^[A-Z]' bundle/app/config/.env) keys, ${empty} with no value"
          # Surface unset secrets in the run summary, named. Not fatal: you may
          # legitimately deploy before every gateway credential exists.
          blank=$(awk -F= '/^[A-Z]/ && $2 == "" { printf "%s ", $1 }' bundle/app/config/.env)
          if [ -n "$blank" ]; then
            echo "::warning::Unset secrets/variables, deployed as empty: ${blank}"
          fi
          for required in DB_HOST DB_NAME DB_USER DB_PASS; do
            grep -q "^${required}=." bundle/app/config/.env || \
              echo "::warning::${required} is empty — the app cannot reach MySQL until it is set."
          done
          grep -q "^APP_KEY=." bundle/app/config/.env || \
            echo "::warning::APP_KEY is empty — licence lookups and download tokens will fail with a 500."
          # Fatal, not a warning: without these every real licence activation
          # and refresh from the app 500s, while health.php used to say "ok".
          grep -q "^LICENSE_SIGNING_PRIVATE_KEY=." bundle/app/config/.env || \
            { echo "::error::LICENSE_SIGNING_PRIVATE_KEY secret is not set — api/license-status.php would 500 for every app. Set it (php scripts/generate-license-signing-key.php) before deploying."; exit 1; }
          # `if`, not `grep && exit`: as a step's last command, a non-matching
          # grep (the healthy case) would itself fail the step.
          if grep -q "^LICENSE_SIGNING_KEY_ID=default$" bundle/app/config/.env; then
            echo "::error::LICENSE_SIGNING_KEY_ID variable is not set — it must match a kid in the app's ACCEPTED_PUBLIC_KEYS (e.g. 2026-09)."
            exit 1
          fi

      - name: Upload site + api (attempt 1)
        id: upload_site_api_0
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          timeout:     ${{ env.FTP_TIMEOUT_MS }}
          server:      ${{ secrets.FTP_HOST }}
          username:    ${{ secrets.FTP_USERNAME }}
          password:    ${{ secrets.FTP_PASSWORD }}
          port:        ${{ vars.FTP_PORT || 21 }}
          protocol:    ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir:   ./bundle/web/
          server-dir:  ${{ vars.FTP_SERVER_DIR || secrets.FTP_SERVER_DIR }}
          state-name:  .ftp-deploy-web.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/private-storage/**
            **/.well-known/**
            **/cgi-bin/**
            **/error_log
            **/.ftpquota
            **/php.ini
            **/.user.ini


      - name: Cool down before retry
        if: steps.upload_site_api_0.outcome == 'failure'
        run: |
          echo "::warning::FTP step 'Upload site + api' timed out or failed; retrying once after 45s."
          sleep 45

      - name: Upload site + api (retry)
        if: steps.upload_site_api_0.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          timeout:     ${{ env.FTP_TIMEOUT_MS }}
          server:      ${{ secrets.FTP_HOST }}
          username:    ${{ secrets.FTP_USERNAME }}
          password:    ${{ secrets.FTP_PASSWORD }}
          port:        ${{ vars.FTP_PORT || 21 }}
          protocol:    ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir:   ./bundle/web/
          server-dir:  ${{ vars.FTP_SERVER_DIR || secrets.FTP_SERVER_DIR }}
          state-name:  .ftp-deploy-web.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/private-storage/**
            **/.well-known/**
            **/cgi-bin/**
            **/error_log
            **/.ftpquota
            **/php.ini
            **/.user.ini


      - name: Pace FTP connections
        run: sleep 15   # shared hosts throttle rapid reconnects

      - name: Upload backend classes (attempt 1)
        id: upload_backend_classes_1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          timeout:     ${{ env.FTP_TIMEOUT_MS }}
          server:      ${{ secrets.FTP_HOST }}
          username:    ${{ secrets.FTP_USERNAME }}
          password:    ${{ secrets.FTP_PASSWORD }}
          port:        ${{ vars.FTP_PORT || 21 }}
          protocol:    ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir:   ./bundle/app/src/
          server-dir:  ${{ vars.APP_ROOT }}/src/
          state-name:  .ftp-deploy-app-src.json
          dangerous-clean-slate: false


      - name: Cool down before retry
        if: steps.upload_backend_classes_1.outcome == 'failure'
        run: |
          echo "::warning::FTP step 'Upload backend classes' timed out or failed; retrying once after 45s."
          sleep 45

      - name: Upload backend classes (retry)
        if: steps.upload_backend_classes_1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          timeout:     ${{ env.FTP_TIMEOUT_MS }}
          server:      ${{ secrets.FTP_HOST }}
          username:    ${{ secrets.FTP_USERNAME }}
          password:    ${{ secrets.FTP_PASSWORD }}
          port:        ${{ vars.FTP_PORT || 21 }}
          protocol:    ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir:   ./bundle/app/src/
          server-dir:  ${{ vars.APP_ROOT }}/src/
          state-name:  .ftp-deploy-app-src.json
          dangerous-clean-slate: false


      - name: Pace FTP connections
        run: sleep 15   # shared hosts throttle rapid reconnects

      - name: Upload generated .env (attempt 1)
        id: upload_generated_env_2
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          timeout:     ${{ env.FTP_TIMEOUT_MS }}
          server:      ${{ secrets.FTP_HOST }}
          username:    ${{ secrets.FTP_USERNAME }}
          password:    ${{ secrets.FTP_PASSWORD }}
          port:        ${{ vars.FTP_PORT || 21 }}
          protocol:    ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir:   ./bundle/app/config/
          server-dir:  ${{ vars.APP_ROOT }}/config/
          state-name:  .ftp-deploy-app-config.json
          dangerous-clean-slate: false


      - name: Cool down before retry
        if: steps.upload_generated_env_2.outcome == 'failure'
        run: |
          echo "::warning::FTP step 'Upload generated .env' timed out or failed; retrying once after 45s."
          sleep 45

      - name: Upload generated .env (retry)
        if: steps.upload_generated_env_2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          timeout:     ${{ env.FTP_TIMEOUT_MS }}
          server:      ${{ secrets.FTP_HOST }}
          username:    ${{ secrets.FTP_USERNAME }}
          password:    ${{ secrets.FTP_PASSWORD }}
          port:        ${{ vars.FTP_PORT || 21 }}
          protocol:    ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir:   ./bundle/app/config/
          server-dir:  ${{ vars.APP_ROOT }}/config/
          state-name:  .ftp-deploy-app-config.json
          dangerous-clean-slate: false

      - name: Smoke test
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set +e
          bash scripts/smoke-test.sh "$SITE_URL"
          rc=$?
          set -e
          # 0 = passed. 1 = a real failure (site broken, or something private is
          # reachable) — must break the build. 2 = the host's edge blocked the
          # runner, so nothing could be verified; that is not evidence the deploy
          # is bad, so warn loudly and carry on. The same API checks already ran
          # against this exact commit before the deploy (ci.yml, `verify` job),
          # so a blocked run here never means the build went out untested.
          if [ "$rc" -eq 2 ]; then
            echo "::warning::Post-deploy smoke test was INCONCLUSIVE (edge blocked the runner). Pre-deploy checks passed; verify the live site manually."
            exit 0
          fi
          exit "$rc""

  # ==========================================================================
  # 3. PRODUCTION — dry run first, then a gated real deploy
  # ==========================================================================
  production-dry-run:
    name: Production dry run
    needs: build
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
    runs-on: ubuntu-latest
    # No `environment:` here on purpose — the dry run needs no approval, so you
    # can read the diff BEFORE deciding whether to approve the real thing.
    steps:
      # checkout FIRST: it cleans the workspace, which would wipe the artifact.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { sparse-checkout: scripts }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: deploy-bundle, path: bundle }

      - name: Preflight — verify server paths before connecting
        # Values come in via `env:` rather than being interpolated straight into
        # the shell: it keeps a variable containing quotes or $() from being
        # executed, and it lets the step report what actually resolved.
        env:
          JOB_ENVIRONMENT: '(none — repository-level variables only)'
          SITE_URL: ${{ vars.SITE_URL }}
          APP_ROOT: ${{ vars.APP_ROOT }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || secrets.FTP_SERVER_DIR }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ vars.FTP_PORT || 21 }}
        run: |
          echo "Variable resolution for this job"
          echo "  job environment : ${JOB_ENVIRONMENT}"
          echo "  repository      : ${GITHUB_REPOSITORY}"
          for v in SITE_URL APP_ROOT FTP_SERVER_DIR; do
            val="${!v}"
            if [ -n "$val" ]; then
              printf '  %-18s set (%s chars)\n' "vars.$v" "${#val}"
            else
              printf '  %-18s EMPTY — not visible to this job\n' "vars.$v"
            fi
          done
          echo
          bash scripts/preflight-paths.sh "$FTP_SERVER_DIR" "${APP_ROOT}/" "$SITE_URL"
          echo
          bash scripts/check-ftp-host.sh "$FTP_HOST" "${FTP_PORT:-21}"

      - name: Placeholder config (dry run never uploads it)
        run: |
          mkdir -p bundle/app/config
          echo "APP_ENV=production" > bundle/app/config/.env

      - name: Dry run — show exactly what would change (attempt 1)
        id: dry_run_show_exactly_what__3
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          timeout:     ${{ env.FTP_TIMEOUT_MS }}
          server:      ${{ secrets.FTP_HOST }}
          username:    ${{ secrets.FTP_USERNAME }}
          password:    ${{ secrets.FTP_PASSWORD }}
          port:        ${{ vars.FTP_PORT || 21 }}
          protocol:    ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir:   ./bundle/web/
