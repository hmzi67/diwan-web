name: Deploy

# ---------------------------------------------------------------------------
# push to `staging` -> staging site (automatic)
# push to `main`    -> production   (requires manual approval, see README)
# workflow_dispatch -> either, with an optional dry run
# ---------------------------------------------------------------------------
on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to deploy'
        required: true
        default: staging
        type: choice
        options: [staging, production]
      dry_run:
        description: 'Dry run only — list changes, upload nothing'
        required: false
        default: false
        type: boolean

# Never let two deploys race to the same FTP account.
# One FTP account serves staging AND production, and shared hosts cap concurrent
# logins. A ref-keyed group would let a staging push and a main push connect at
# the same moment; a constant group makes every deploy queue instead.
concurrency:
  group: ftp-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The action defaults to 30000ms. Shared hosts under load routinely take
  # longer than that to answer a control-socket command, which surfaces as
  # "Error: Timeout (control socket)".
  FTP_TIMEOUT_MS: '60000'

jobs:
  # ==========================================================================
  # 1. BUILD — everything that can fail, fails here, before any FTP connection
  # ==========================================================================
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'   # match the server; see docs/SERVER-CHECKLIST.md
          tools: none

      - name: Lint every PHP file
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null || { echo "::error file=$file::PHP syntax error"; fail=1; }
          done < <(find backend -name '*.php' -print0)
          [ "$fail" -eq 0 ] || exit 1
          echo "PHP lint passed."

      - name: Build frontend
        run: bash frontend/build.sh   # `set -e` inside; a failure stops the job

      - name: Assemble deployment bundle
        run: |
          set -euo pipefail
          # bundle/web -> public_html      (static site + api/)
          # bundle/app -> ~/app            (PHP classes, NOT web accessible)
          mkdir -p bundle/web/api bundle/app/src bundle/app/config

          cp -R frontend/dist/.        bundle/web/
          cp -R backend/public/.       bundle/web/api/
          cp -R backend/src/.          bundle/app/src/

          # Things that must never reach the server.
          rm -f  bundle/web/api/_app_root.php.example
          rm -rf bundle/web/node_modules bundle/app/node_modules
          find bundle -name '.DS_Store' -delete
          find bundle -name '*.md'      -delete
          find bundle -name '.env*'     -delete

          echo "--- bundle contents ---"
          find bundle -type f | sort

      # Hard stop: a binary or a secret in the bundle is a release-blocking bug.
      - name: Guard — no installers or secrets in the bundle
        run: |
          set -euo pipefail
          if find bundle -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.apk' \
               -o -name '*.msi' -o -name '*.pkg' \) | grep -q .; then
            echo "::error::Installer binaries found in the deploy bundle. They belong in private-storage, uploaded manually."
            exit 1
          fi
          if find bundle -name '.env' -o -name '.env.*' | grep -q .; then
            echo "::error::An .env file is in the deploy bundle."
            exit 1
          fi
          if grep -rIl --exclude-dir=.git -E 'JAZZCASH_INTEGRITY_SALT=[^[:space:]]|DB_PASS=[^[:space:]]' bundle 2>/dev/null | grep -q .; then
            echo "::error::Hardcoded credentials detected in the deploy bundle."
            exit 1
          fi
          echo "Bundle guard passed."

      - uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle
          path: bundle/
          retention-days: 7
          include-hidden-files: true   # .htaccess files are the whole point

  # ==========================================================================
  # 2. STAGING — automatic on push to `staging`
  # ==========================================================================
  deploy-staging:
    name: Deploy to staging
    needs: build
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/staging') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: scripts }

      - uses: actions/download-artifact@v4
        with: { name: deploy-bundle, path: bundle }

      - name: Preflight — verify server paths before connecting
        # Values come in via `env:` rather than being interpolated straight into
        # the shell: it keeps a variable containing quotes or $() from being
        # executed, and it lets the step report what actually resolved.
        env:
          JOB_ENVIRONMENT: 'staging'
          SITE_URL: ${{ vars.SITE_URL }}
          APP_ROOT: ${{ vars.APP_ROOT }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || secrets.FTP_SERVER_DIR }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ vars.FTP_PORT || 21 }}
        run: |
          echo "Variable resolution for this job"
          echo "  job environment : ${JOB_ENVIRONMENT}"
          echo "  repository      : ${GITHUB_REPOSITORY}"
          for v in SITE_URL APP_ROOT FTP_SERVER_DIR; do
            val="${!v}"
            if [ -n "$val" ]; then
              printf '  %-18s set (%s chars)\n' "vars.$v" "${#val}"
            else
              printf '  %-18s EMPTY — not visible to this job\n' "vars.$v"
            fi
          done
          echo
          bash scripts/preflight-paths.sh "$FTP_SERVER_DIR" "${APP_ROOT}/" "$SITE_URL"
          echo
          bash scripts/check-ftp-host.sh "$FTP_HOST" "${FTP_PORT:-21}"

      - name: Generate server config from secrets
        run: |
          set -euo pipefail
          # upload-artifact drops empty directories, so bundle/app/config/ does
          # not survive the round-trip from the build job. Recreate it here.
          mkdir -p bundle/app/config
          cat > bundle/app/config/.env <<EOF
          APP_ENV=staging
          APP_DEBUG=false
          APP_URL=${{ vars.SITE_URL }}
          APP_KEY=${{ secrets.APP_KEY }}
          APP_COMMIT=${{ github.sha }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ vars.DB_PORT || '3306' }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASS=${{ secrets.DB_PASS }}
          LICENSE_VALIDITY_DAYS=${{ vars.LICENSE_VALIDITY_DAYS || 0 }}
          DOWNLOAD_LINK_TTL_MINUTES=${{ vars.DOWNLOAD_LINK_TTL_MINUTES || 15 }}
          DOWNLOAD_MAX_ATTEMPTS=${{ vars.DOWNLOAD_MAX_ATTEMPTS || 5 }}
          PAYMENT_GATEWAY=${{ vars.PAYMENT_GATEWAY }}
          JAZZCASH_MERCHANT_ID=${{ secrets.JAZZCASH_MERCHANT_ID }}
          JAZZCASH_PASSWORD=${{ secrets.JAZZCASH_PASSWORD }}
          JAZZCASH_INTEGRITY_SALT=${{ secrets.JAZZCASH_INTEGRITY_SALT }}
          JAZZCASH_ENDPOINT=${{ vars.JAZZCASH_ENDPOINT }}
          EASYPAISA_STORE_ID=${{ secrets.EASYPAISA_STORE_ID }}
          EASYPAISA_HASH_KEY=${{ secrets.EASYPAISA_HASH_KEY }}
          SAFEPAY_API_KEY=${{ secrets.SAFEPAY_API_KEY }}
          SAFEPAY_WEBHOOK_SECRET=${{ secrets.SAFEPAY_WEBHOOK_SECRET }}
          MAIL_FROM=${{ vars.MAIL_FROM }}
          MAIL_FROM_NAME=Diwan POS
          EOF
          # Prove the file exists and is populated, without printing any value.
          # Keys only: a missing secret shows up as a key with an empty value.
          echo "--- generated .env ---"
          test -s bundle/app/config/.env || { echo "::error::.env is missing or empty"; exit 1; }
          awk -F= '/^[A-Z]/ { printf "  %-26s %s\n", $1, ($2 == "" ? "(EMPTY!)" : "set") }' \
            bundle/app/config/.env
          empty=$(awk -F= '/^[A-Z]/ && $2 == "" { c++ } END { print c+0 }' bundle/app/config/.env)
          echo "  -> $(grep -c '^[A-Z]' bundle/app/config/.env) keys, ${empty} with no value"
          # Surface unset secrets in the run summary, named. Not fatal: you may
          # legitimately deploy before every gateway credential exists.
          blank=$(awk -F= '/^[A-Z]/ && $2 == "" { printf "%s ", $1 }' bundle/app/config/.env)
          if [ -n "$blank" ]; then
            echo "::warning::Unset secrets/variables, deployed as empty: ${blank}"
          fi
          for required in DB_HOST DB_NAME DB_USER DB_PASS; do
            grep -q "^${required}=." bundle/app/config/.env || \
              echo "::warning::${required} is empty — the app cannot reach MySQL until it is set."
          done
          grep -q "^APP_KEY=." bundle/app/config/.env || \
            echo "::warning::APP_KEY is empty — licence lookups and download tokens will fail with a 500."

      - name: Upload site + api (attempt 1)
        id: upload_site_api_0
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          timeout:     ${{ env.FTP_TIMEOUT_MS }}
          server:      ${{ secrets.FTP_HOST }}
          username:    ${{ secrets.FTP_USERNAME }}
          password:    ${{ secrets.FTP_PASSWORD }}
          port:        ${{ vars.FTP_PORT || 21 }}
          protocol:    ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir:   ./bundle/web/
          server-dir:  ${{ vars.FTP_SERVER_DIR || secrets.FTP_SERVER_DIR }}
          state-name:  .ftp-deploy-web.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/private-storage/**
            **/.well-known/**
            **/cgi-bin/**
            **/error_log
            **/.ftpquota
            **/php.ini
            **/.user.ini


      - name: Cool down before retry
        if: steps.upload_site_api_0.outcome == 'failure'
        run: |
          echo "::warning::FTP step 'Upload site + api' timed out or failed; retrying once after 45s."
          sleep 45

      - name: Upload site + api (retry)
        if: steps.upload_site_api_0.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          timeout:     ${{ env.FTP_TIMEOUT_MS }}
          server:      ${{ secrets.FTP_HOST }}
          username:    ${{ secrets.FTP_USERNAME }}
          password:    ${{ secrets.FTP_PASSWORD }}
          port:        ${{ vars.FTP_PORT || 21 }}
          protocol:    ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir:   ./bundle/web/
          server-dir:  ${{ vars.FTP_SERVER_DIR || secrets.FTP_SERVER_DIR }}
          state-name:  .ftp-deploy-web.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/private-storage/**
            **/.well-known/**
            **/cgi-bin/**
            **/error_log
            **/.ftpquota
            **/php.ini
            **/.user.ini


      - name: Pace FTP connections
        run: sleep 15   # shared hosts throttle rapid reconnects

      - name: Upload backend classes (attempt 1)
        id: upload_backend_classes_1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          timeout:     ${{ env.FTP_TIMEOUT_MS }}
          server:      ${{ secrets.FTP_HOST }}
          username:    ${{ secrets.FTP_USERNAME }}
          password:    ${{ secrets.FTP_PASSWORD }}
          port:        ${{ vars.FTP_PORT || 21 }}
          protocol:    ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir:   ./bundle/app/src/
          server-dir:  ${{ vars.APP_ROOT }}/src/
          state-name:  .ftp-deploy-app-src.json
          dangerous-clean-slate: false


      - name: Cool down before retry
        if: steps.upload_backend_classes_1.outcome == 'failure'
        run: |
          echo "::warning::FTP step 'Upload backend classes' timed out or failed; retrying once after 45s."
          sleep 45

      - name: Upload backend classes (retry)
        if: steps.upload_backend_classes_1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          timeout:     ${{ env.FTP_TIMEOUT_MS }}
          server:      ${{ secrets.FTP_HOST }}
          username:    ${{ secrets.FTP_USERNAME }}
          password:    ${{ secrets.FTP_PASSWORD }}
          port:        ${{ vars.FTP_PORT || 21 }}
          protocol:    ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir:   ./bundle/app/src/
          server-dir:  ${{ vars.APP_ROOT }}/src/
          state-name:  .ftp-deploy-app-src.json
          dangerous-clean-slate: false


      - name: Pace FTP connections
        run: sleep 15   # shared hosts throttle rapid reconnects

      - name: Upload generated .env (attempt 1)
        id: upload_generated_env_2
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          timeout:     ${{ env.FTP_TIMEOUT_MS }}
          server:      ${{ secrets.FTP_HOST }}
          username:    ${{ secrets.FTP_USERNAME }}
          password:    ${{ secrets.FTP_PASSWORD }}
          port:        ${{ vars.FTP_PORT || 21 }}
          protocol:    ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir:   ./bundle/app/config/
          server-dir:  ${{ vars.APP_ROOT }}/config/
          state-name:  .ftp-deploy-app-config.json
          dangerous-clean-slate: false


      - name: Cool down before retry
        if: steps.upload_generated_env_2.outcome == 'failure'
        run: |
          echo "::warning::FTP step 'Upload generated .env' timed out or failed; retrying once after 45s."
          sleep 45

      - name: Upload generated .env (retry)
        if: steps.upload_generated_env_2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          timeout:     ${{ env.FTP_TIMEOUT_MS }}
          server:      ${{ secrets.FTP_HOST }}
          username:    ${{ secrets.FTP_USERNAME }}
          password:    ${{ secrets.FTP_PASSWORD }}
          port:        ${{ vars.FTP_PORT || 21 }}
          protocol:    ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir:   ./bundle/app/config/
          server-dir:  ${{ vars.APP_ROOT }}/config/
          state-name:  .ftp-deploy-app-config.json
          dangerous-clean-slate: false

      - name: Smoke test
        run: bash scripts/smoke-test.sh "${{ vars.SITE_URL }}"

  # ==========================================================================
  # 3. PRODUCTION — dry run first, then a gated real deploy
  # ==========================================================================
  production-dry-run:
    name: Production dry run
    needs: build
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
    runs-on: ubuntu-latest
    # No `environment:` here on purpose — the dry run needs no approval, so you
    # can read the diff BEFORE deciding whether to approve the real thing.
    steps:
      # checkout FIRST: it cleans the workspace, which would wipe the artifact.
      - uses: actions/checkout@v4
        with: { sparse-checkout: scripts }

      - uses: actions/download-artifact@v4
        with: { name: deploy-bundle, path: bundle }

      - name: Preflight — verify server paths before connecting
        # Values come in via `env:` rather than being interpolated straight into
        # the shell: it keeps a variable containing quotes or $() from being
        # executed, and it lets the step report what actually resolved.
        env:
          JOB_ENVIRONMENT: '(none — repository-level variables only)'
          SITE_URL: ${{ vars.SITE_URL }}
          APP_ROOT: ${{ vars.APP_ROOT }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || secrets.FTP_SERVER_DIR }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ vars.FTP_PORT || 21 }}
        run: |
          echo "Variable resolution for this job"
          echo "  job environment : ${JOB_ENVIRONMENT}"
          echo "  repository      : ${GITHUB_REPOSITORY}"
          for v in SITE_URL APP_ROOT FTP_SERVER_DIR; do
            val="${!v}"
            if [ -n "$val" ]; then
              printf '  %-18s set (%s chars)\n' "vars.$v" "${#val}"
            else
              printf '  %-18s EMPTY — not visible to this job\n' "vars.$v"
            fi
          done
          echo
          bash scripts/preflight-paths.sh "$FTP_SERVER_DIR" "${APP_ROOT}/" "$SITE_URL"
          echo
          bash scripts/check-ftp-host.sh "$FTP_HOST" "${FTP_PORT:-21}"

      - name: Placeholder config (dry run never uploads it)
        run: |
          mkdir -p bundle/app/config
          echo "APP_ENV=production" > bundle/app/config/.env

      - name: Dry run — show exactly what would change (attempt 1)
        id: dry_run_show_exactly_what__3
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          timeout:     ${{ env.FTP_TIMEOUT_MS }}
          server:      ${{ secrets.FTP_HOST }}
          username:    ${{ secrets.FTP_USERNAME }}
          password:    ${{ secrets.FTP_PASSWORD }}
          port:        ${{ vars.FTP_PORT || 21 }}
          protocol:    ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir:   ./bundle/web/
          server-dir:  ${{ vars.FTP_SERVER_DIR || secrets.FTP_SERVER_DIR }}
          state-name:  .ftp-deploy-web.json
          dry-run: true
          log-level: verbose
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/private-storage/**
            **/.well-known/**
            **/cgi-bin/**
            **/error_log
            **/.ftpquota
            **/php.ini
            **/.user.ini


      - name: Cool down before retry
        if: steps.dry_run_show_exactly_what__3.outcome == 'failure'
        run: |
          echo "::warning::FTP step 'Dry run — show exactly what would change' timed out or failed; retrying once after 45s."
          sleep 45

      - name: Dry run — show exactly what would change (retry)
        if: steps.dry_run_show_exactly_what__3.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          timeout:     ${{ env.FTP_TIMEOUT_MS }}
          server:      ${{ secrets.FTP_HOST }}
          username:    ${{ secrets.FTP_USERNAME }}
          password:    ${{ secrets.FTP_PASSWORD }}
          port:        ${{ vars.FTP_PORT || 21 }}
          protocol:    ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir:   ./bundle/web/
          server-dir:  ${{ vars.FTP_SERVER_DIR || secrets.FTP_SERVER_DIR }}
          state-name:  .ftp-deploy-web.json
          dry-run: true
          log-level: verbose
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/private-storage/**
            **/.well-known/**
            **/cgi-bin/**
            **/error_log
            **/.ftpquota
            **/php.ini
            **/.user.ini

  deploy-production:
    name: Deploy to production
    needs: [build, production-dry-run]
    if: |
      github.event.inputs.dry_run != 'true' && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
      )
    runs-on: ubuntu-latest
    # Add a required reviewer to this environment in repo Settings and the job
    # will pause here until a human clicks Approve. That is the confirmation gate.
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: scripts }

      - uses: actions/download-artifact@v4
        with: { name: deploy-bundle, path: bundle }

      - name: Preflight — verify server paths before connecting
        # Values come in via `env:` rather than being interpolated straight into
        # the shell: it keeps a variable containing quotes or $() from being
        # executed, and it lets the step report what actually resolved.
        env:
          JOB_ENVIRONMENT: 'production'
          SITE_URL: ${{ vars.SITE_URL }}
          APP_ROOT: ${{ vars.APP_ROOT }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || secrets.FTP_SERVER_DIR }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ vars.FTP_PORT || 21 }}
        run: |
          echo "Variable resolution for this job"
          echo "  job environment : ${JOB_ENVIRONMENT}"
          echo "  repository      : ${GITHUB_REPOSITORY}"
          for v in SITE_URL APP_ROOT FTP_SERVER_DIR; do
            val="${!v}"
            if [ -n "$val" ]; then
              printf '  %-18s set (%s chars)\n' "vars.$v" "${#val}"
            else
              printf '  %-18s EMPTY — not visible to this job\n' "vars.$v"
            fi
          done
          echo
          bash scripts/preflight-paths.sh "$FTP_SERVER_DIR" "${APP_ROOT}/" "$SITE_URL"
          echo
          bash scripts/check-ftp-host.sh "$FTP_HOST" "${FTP_PORT:-21}"

      - name: Generate server config from secrets
        run: |
          set -euo pipefail
          # upload-artifact drops empty directories, so bundle/app/config/ does
          # not survive the round-trip from the build job. Recreate it here.
          mkdir -p bundle/app/config
          cat > bundle/app/config/.env <<EOF
          APP_ENV=production
          APP_DEBUG=false
          APP_URL=${{ vars.SITE_URL }}
          APP_KEY=${{ secrets.APP_KEY }}
          APP_COMMIT=${{ github.sha }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ vars.DB_PORT || '3306' }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASS=${{ secrets.DB_PASS }}
          LICENSE_VALIDITY_DAYS=${{ vars.LICENSE_VALIDITY_DAYS || 0 }}
          DOWNLOAD_LINK_TTL_MINUTES=${{ vars.DOWNLOAD_LINK_TTL_MINUTES || 15 }}
          DOWNLOAD_MAX_ATTEMPTS=${{ vars.DOWNLOAD_MAX_ATTEMPTS || 5 }}
          PAYMENT_GATEWAY=${{ vars.PAYMENT_GATEWAY }}
          JAZZCASH_MERCHANT_ID=${{ secrets.JAZZCASH_MERCHANT_ID }}
          JAZZCASH_PASSWORD=${{ secrets.JAZZCASH_PASSWORD }}
          JAZZCASH_INTEGRITY_SALT=${{ secrets.JAZZCASH_INTEGRITY_SALT }}
          JAZZCASH_ENDPOINT=${{ vars.JAZZCASH_ENDPOINT }}
          EASYPAISA_STORE_ID=${{ secrets.EASYPAISA_STORE_ID }}
          EASYPAISA_HASH_KEY=${{ secrets.EASYPAISA_HASH_KEY }}
          SAFEPAY_API_KEY=${{ secrets.SAFEPAY_API_KEY }}
          SAFEPAY_WEBHOOK_SECRET=${{ secrets.SAFEPAY_WEBHOOK_SECRET }}
          MAIL_FROM=${{ vars.MAIL_FROM }}
          MAIL_FROM_NAME=Diwan POS
          EOF
          # Prove the file exists and is populated, without printing any value.
          # Keys only: a missing secret shows up as a key with an empty value.
          echo "--- generated .env ---"
          test -s bundle/app/config/.env || { echo "::error::.env is missing or empty"; exit 1; }
          awk -F= '/^[A-Z]/ { printf "  %-26s %s\n", $1, ($2 == "" ? "(EMPTY!)" : "set") }' \
            bundle/app/config/.env
          empty=$(awk -F= '/^[A-Z]/ && $2 == "" { c++ } END { print c+0 }' bundle/app/config/.env)
          echo "  -> $(grep -c '^[A-Z]' bundle/app/config/.env) keys, ${empty} with no value"
          # Surface unset secrets in the run summary, named. Not fatal: you may
          # legitimately deploy before every gateway credential exists.
          blank=$(awk -F= '/^[A-Z]/ && $2 == "" { printf "%s ", $1 }' bundle/app/config/.env)
          if [ -n "$blank" ]; then
            echo "::warning::Unset secrets/variables, deployed as empty: ${blank}"
          fi
          for required in DB_HOST DB_NAME DB_USER DB_PASS; do
            grep -q "^${required}=." bundle/app/config/.env || \
              echo "::warning::${required} is empty — the app cannot reach MySQL until it is set."
          done
          grep -q "^APP_KEY=." bundle/app/config/.env || \
            echo "::warning::APP_KEY is empty — licence lookups and download tokens will fail with a 500."

      # Order matters: classes and config land BEFORE the entrypoints that call
      # them, so there is no window where new PHP looks for a class that is not
      # there yet.
      # production-dry-run has just disconnected. With no required reviewer on
      # the environment this job starts immediately, so let the server settle.
      - name: Settle after dry-run connection
        run: sleep 20

      - name: Upload backend classes (attempt 1)
        id: upload_backend_classes_4
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          timeout:     ${{ env.FTP_TIMEOUT_MS }}
          server:      ${{ secrets.FTP_HOST }}
          username:    ${{ secrets.FTP_USERNAME }}
          password:    ${{ secrets.FTP_PASSWORD }}
          port:        ${{ vars.FTP_PORT || 21 }}
